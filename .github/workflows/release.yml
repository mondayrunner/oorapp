# Builds Oorapp for macOS (Apple silicon) and Windows when a version tag is
# pushed, and puts the installers on a draft GitHub release together with
# latest.json, which the app's updater reads once the release is published.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY   the updater key (~/.config/oorapp/updater.key)
#   APPLE_CERTIFICATE           base64 of the signing .p12, so macOS keeps the
#   APPLE_CERTIFICATE_PASSWORD  app's permissions from one update to the next
#                               (imported by hand below, not by Tauri)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # The Oorapp certificate is self-signed, which Tauri's own certificate
      # import does not accept. So it goes into a keychain here, and Tauri only
      # gets its fingerprint, as on a developer's Mac.
      - name: Put the Oorapp signing certificate in a keychain
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/oorapp.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/oorapp.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/oorapp.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/oorapp.p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Fingerprint of the Oorapp certificate (~/.config/oorapp/signing.p12).
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'F3C2449B956625BA78F086FC62F6480DC2CAFE52' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Oorapp v__VERSION__
          releaseBody: |
            Download the installer for your computer below.

            macOS (Apple silicon): open the .dmg and drag Oorapp to Applications. The first time, right-click Oorapp and choose Open, because the app is not notarized by Apple.
            Windows (experimental, not tested on a real machine yet): run the -setup.exe. SmartScreen may warn the first time; choose More info, then Run anyway. Transcription runs on the CPU, so long meetings take a while. Notes use Alt+Shift+Space. Please report what works and what does not in the issues.

            Installed already? Oorapp updates itself.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
