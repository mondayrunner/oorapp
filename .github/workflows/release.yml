# Builds Oorapp for macOS (Apple silicon) and Windows when a version tag is
# pushed, and puts the installers on a draft GitHub release together with
# latest.json, which the app's updater reads once the release is published.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY   the updater key (~/.config/oorapp/updater.key)
#   APPLE_CERTIFICATE           base64 of the signing .p12, so macOS keeps the
#   APPLE_CERTIFICATE_PASSWORD  app's permissions from one update to the next
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Oorapp
        with:
          tagName: v__VERSION__
          releaseName: Oorapp v__VERSION__
          releaseBody: |
            Download the installer for your computer below.

            macOS (Apple silicon): open the .dmg and drag Oorapp to Applications. The first time, right-click Oorapp and choose Open, because the app is not notarized by Apple.
            Windows: run the -setup.exe. Windows SmartScreen may warn the first time; choose More info, then Run anyway.

            Installed already? Oorapp updates itself.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
