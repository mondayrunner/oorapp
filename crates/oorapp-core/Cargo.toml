[package]
name = "oorapp-core"
description = "Transcription, speakers and meeting files for Oorapp, without a GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "2.5.0"
dirs = "7"
jiff = "0.2"
libc = "0.2"
ogg = "0.9"
opus = "0.4"
parakeet-rs = "0.4"
ort = "2.0.0-rc.13"
realfft = "3"
rubato = "5"
serde_json = "1.0"
trash = "5"
symphonia = { version = "0.6", features = ["all"] }
ureq = "3.4"
whisper-rs = "0.16"

[features]
default = []
# GPU transcription. Metal on macOS, Vulkan on Windows and Linux.
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]
