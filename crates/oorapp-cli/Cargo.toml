[package]
name = "oorapp-cli"
description = "Oorapp on the command line: transcribe, diarize, ask, action"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oorapp"
path = "src/main.rs"

[dependencies]
async-channel = "2.5"
jiff = "0.2"
oorapp-capture = { path = "../oorapp-capture" }
oorapp-core.workspace = true
serde_json = "1"

[features]
metal = ["oorapp-core/metal"]
vulkan = ["oorapp-core/vulkan"]
